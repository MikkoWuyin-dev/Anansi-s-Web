name: verify

# The single gate: typecheck, content drift check, tests, production build.
# AGENTS.md (Commands) requires this before any work is called done; nothing
# enforced it on the remote until this workflow existed. MCD §6 expects content validation
# to run "in CI".

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json declares node >= 22.12.0: the authoring scripts need
          # type stripping, and Vitest 5 raises the floor above it. 24.x is the
          # line the gate has been verified on.
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - run: npm run verify
