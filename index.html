<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Anansi's Web — one intriguing story to find, take, and explain. Every day." />
    <meta name="theme-color" content="#08090A" />
    <script>
      // The mode has to be on the document before the first paint, so a stored
      // choice never flashes the other page (spec 0007, AC-5). It reads the key
      // the app writes, accepts only the three known choices, and falls back to
      // the system and then to dark, which is the base token set.
      try {
        var stored = JSON.parse(localStorage.getItem('anansi:v1:mode'))
        var choice = stored && stored.version === 1 ? stored.choice : 'system'
        var light =
          choice === 'light' ||
          (choice !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.mode = light ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.mode = 'dark'
      }
    </script>
    <!-- The display face is self-hosted (Phase 9.3), so the first paint asks
         no other origin for anything. One latin variable file, 22 kB. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308090A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FAFF00' stroke-width='2'/%3E%3Cpath d='M16 3v26M3 16h26M7 7l18 18M25 7L7 25' stroke='%23FAFF00' stroke-width='1.5'/%3E%3C/svg%3E" />
    <title>Anansi's Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
